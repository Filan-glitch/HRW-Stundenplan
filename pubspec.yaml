name: timetable
description: Stundenplan

publish_to: "none"

version: 2.0.1+10

environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  redux: ^5.0.0
  yaml: ^3.1.2
  html: ^0.15.4
  http: ^1.2.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  firebase_crashlytics: ^4.0.0
  firebase_core: ^3.0.0
  markdown_widget: ^2.3.2+6
