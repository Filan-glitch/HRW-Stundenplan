name: timetable
description: "HRW Stundenplan"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.1.0+12

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  redux: ^5.0.0
  yaml: ^3.1.3
  html: ^0.15.6
  http: ^1.5.0
  google_fonts: ^6.3.1
  url_launcher: ^6.3.2
  firebase_crashlytics: ^5.0.2
  firebase_core: ^4.1.1
  markdown_widget: ^2.3.2+8
  sqflite: ^2.4.2
  salomon_bottom_bar: ^3.3.2
  shared_preferences: ^2.5.3
  flutter_redux: ^0.10.0
  mutex: ^3.1.0
  flutter_inappwebview: ^6.1.5
  workmanager: ^0.9.0+3
  path: ^1.9.1
  collection: ^1.19.1
  path_provider: ^2.1.5
  fluttertoast: ^9.0.0

  intl: any
dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - pubspec.yaml
    - CHANGELOG.md