  cupertino_icons: ^1.0.8
  salomon_bottom_bar: ^3.3.2
  shared_preferences: ^2.2.3
  flutter_redux: ^0.10.0
  mutex: ^3.1.0
  flutter_inappwebview: ^6.0.0
  local_auth: ^2.2.0
  flutter_local_notifications: ^17.1.2
  workmanager: ^0.5.2
  disable_battery_optimization: ^1.1.1
